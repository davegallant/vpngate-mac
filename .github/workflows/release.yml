name: Release

on:
  push:
    tags:
      - "v*.*.*"
  # Lets the whole pipeline (build, sign, package) be exercised on demand
  # without pushing a real tag. The release-publishing step is skipped for
  # these runs -- see its `if:` condition below.
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      # Matches the Xcode version this project is developed against (build
      # 17F113, confirmed present on the macos-26-arm64 runner image as of
      # writing). If GitHub drops this version from the image later, this
      # step fails with the list of what's still available -- update
      # xcode-version below to match.
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26.6"

      - name: Run Shared package tests
        run: cd Shared && swift test

      - name: Import signing certificate
        env:
          MACOS_CERT_P12_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          set -euo pipefail

          KEYCHAIN_PATH="$RUNNER_TEMP/release-signing.keychain-db"
          KEYCHAIN_PASSWORD=$(uuidgen)

          echo "$MACOS_CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN_PATH" -P "$MACOS_CERT_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | sed 's/"//g')

          rm -f "$RUNNER_TEMP/cert.p12"

          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"

          # The temp keychain only ever has the one cert we just imported, so
          # there's no need to match on team ID here (and the identity name
          # security prints doesn't contain the team ID anyway -- that's
          # buried in the cert's OU field, not the CN it displays).
          CODE_SIGN_IDENTITY=$( (security find-identity -v -p codesigning "$KEYCHAIN_PATH" \
            | head -1 \
            | sed -E 's/^[[:space:]]*[0-9]+\) [A-F0-9]+ "(.*)"$/\1/') || true)
          if [[ -z "$CODE_SIGN_IDENTITY" ]]; then
            echo "No codesigning identity found in imported certificate" >&2
            exit 1
          fi
          echo "CODE_SIGN_IDENTITY_OVERRIDE=$CODE_SIGN_IDENTITY" >> "$GITHUB_ENV"

      - name: Build and package
        env:
          CODE_SIGN_STYLE_OVERRIDE: Manual
        run: ./build-and-package.sh

      - name: Clean up keychain
        if: always()
        run: |
          if [[ -n "${KEYCHAIN_PATH:-}" ]]; then
            security delete-keychain "$KEYCHAIN_PATH" || true
          fi

      - name: Create GitHub release
        if: github.ref_type == 'tag'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" build/VPNGate.zip \
            --title "${{ github.ref_name }}" \
            --generate-notes
